name: sober-runtime-observation
on:
  workflow_dispatch:
    inputs:
      artifact-url:
        description: 'sober tarball URL'
        required: false
        default: 'https://sober.vinegarhq.org/artifacts/2026-08-17_e6ebb5e/b60ba8d894f9a0e99ef7042d72db1c87db80a6d3c8c92bd54dc88a12b752946b/sober-binaries-unified.tar.zst'
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          set +e
          sudo apt-get update -q
          sudo apt-get install -y -q libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            libsecret-1-0 libgles2 libegl1 libcurl4 libfontconfig1 libfreetype6 \
            zstd build-essential patchelf flatpak 2>&1 | tail -2
          echo done-deps
          flatpak --version || true
      - name: fetch sober
        run: |
          set +e
          mkdir -p /opt/sober && cd /opt/sober
          curl -sL -o s.tar.zst "${{ github.event.inputs.artifact-url }}"
          file s.tar.zst
          tar --zstd -xf s.tar.zst --strip-components=1
          cp $GITHUB_WORKSPACE/runtime-extras/*.so* .
          ls -la
          echo '--- missing libs:'; ldd ./sober | grep 'not found' || echo none
      - name: build tools
        run: |
          gcc -O2 -o /opt/sober/spy.so spy.c -shared -fPIC -ldl
          gcc -O2 -o /opt/sober/scrape scrape.c
      - name: baseline run (no tty stdin, like the appimage does)
        run: |
          cd /opt/sober
          timeout 30 sh -c ': | ./sober' > /tmp/out1.txt 2>&1 || true
          echo "=== out1 (baseline)"; head -40 /tmp/out1.txt
      - name: init order via LD_DEBUG
        run: |
          cd /opt/sober
          timeout 30 sh -c ': | env LD_DEBUG=files ./sober' > /tmp/out_lddebug.txt 2>&1 || true
          grep -E 'calling init|transferring|dynamically loaded' /tmp/out_lddebug.txt | tail -20 || true
      - name: baseline with LD_PRELOAD spy (open/stat/getenv/exec logging)
        run: |
          cd /opt/sober
          rm -f /tmp/spy2.log
          timeout 30 sh -c ': | env LD_PRELOAD=/opt/sober/spy.so ./sober' > /tmp/out2.txt 2>&1 || true
          echo "rc=$?"; head -20 /tmp/out2.txt; echo ===SPY; sort -u /tmp/spy2.log | head -120
      - name: scrape run (memory snapshots for decoded strings)
        run: |
          cd /opt/sober
          timeout 30 ./scrape ./sober > /tmp/scrape.txt 2>&1 || true
          echo ===SCRAPE; head /tmp/scrape.txt
          ls round* 2>/dev/null | head
      - name: fake flatpak-info + /app/bin placement
        run: |
          set +e
          sudo apt-get install -y -q xvfb dbus-x11 mesa-utils libgl1-mesa-dri 2>&1 | tail -1
          export $(dbus-launch)
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 2
          export DISPLAY=:99
          echo "DISPLAY=$DISPLAY DBUS=$DBUS_SESSION_BUS_ADDRESS"
          sudo mkdir -p /app/bin
          sudo cp /opt/sober/* /app/bin/ 2>/dev/null || true
          sudo chmod +x /app/bin/sober /app/bin/sober_services
          printf '[Application]\nname=org.vinegarhq.Sober\nruntime=runtime/org.freedesktop.Platform/x86_64/24.08\n[Context]\nshared=network;ipc;\nsockets=x11;wayland;pulseaudio;\ndevices=dri;\n[Instance]\ninstance-id=1\nsession-bus-proxy=true\nsystem-bus-proxy=true\n' | sudo tee /.flatpak-info >/dev/null
          cd /app/bin
          timeout 40 sh -c ': | env DISPLAY=:99 DBUS_SESSION_BUS_ADDRESS='$DBUS_SESSION_BUS_ADDRESS' FLATPAK_ID=org.vinegarhq.Sober ./sober' > /tmp/out3.txt 2>&1 || true
          echo "=== out3"; head -80 /tmp/out3.txt
          rm -f /tmp/spy2.log
          timeout 40 sh -c ': | env DISPLAY=:99 DBUS_SESSION_BUS_ADDRESS='$DBUS_SESSION_BUS_ADDRESS' LD_PRELOAD=/opt/sober/spy.so ./sober' > /tmp/out4.txt 2>&1 || true
          echo "=== out4"; head -20 /tmp/out4.txt; echo ===SPY4; sort -u /tmp/spy2.log | head -250
      - name: scrape with process-tree walk (TracerPid capture)
        run: |
          cd /app/bin
          timeout 30 /opt/sober/scrape ./sober > /tmp/scrape2.txt 2>&1 || true
          cat /tmp/scrape2.txt | head -4
          echo '--- TracerPid lines over time:'
          cat r*.status 2>/dev/null | grep -E '^(Name|Pid|PPid|TracerPid|Seccomp|Cmdline)' | head -60
          echo '--- statuses:'; ls r*.status 2>/dev/null | head
      - name: extract decoded strings from memory snapshots
        run: |
          cd /app/bin
          python3 - <<'EOF'
          import glob, re, struct
          seen = set()
          out = open('/tmp/decoded-strings.txt','w')
          for fn in glob.glob('r*.mem') + glob.glob('/opt/sober/round*'):
              data = open(fn,'rb').read()
              pos = 0
              while pos + 24 < len(data):
                  lo, r, _ = struct.unpack_from('<QQQ', data, pos)
                  pos += 24
                  blob = data[pos:pos+r]
                  pos += r
                  for m in re.finditer(rb'[\x20-\x7e]{8,}', blob):
                      s = m.group().decode()
                      if s not in seen:
                          seen.add(s)
                          out.write(f'{fn} 0x{lo+m.start():x} {s}\n')
          out.close()
          print(len(seen), 'unique strings')
          EOF
          grep -iE 'flatpak|network|ptrace|sandbox|version|appimage|share=|outdated|1\.10|yama|seccomp|portal|override' /tmp/decoded-strings.txt | head -80 || true
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sober-observation
          path: |
            /tmp/out*.txt
            /tmp/spy2.log
            /tmp/scrape*.txt
            /tmp/decoded-strings.txt
            /app/bin/r*.status
            /app/bin/r*.mem
            /opt/sober/round*
          if-no-files-found: ignore
